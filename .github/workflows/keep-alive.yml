name: Keep backend warm

on:
  schedule:
    # Offset off :00/:10/:20... on purpose, since round minutes are peak load and most likely to
    # get delayed or dropped.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL repo variable is not set - skipping ping."
            echo "Set it at Settings -> Secrets and variables -> Actions -> Variables"
            echo "to e.g. https://<your-service>.onrender.com/api/health"
            exit 0
          fi
          curl -sf --max-time 60 "$HEALTH_URL" && echo "OK" || echo "Ping failed (service may still be cold-starting)"
